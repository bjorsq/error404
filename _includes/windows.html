{%- comment -%}
    Markup for every window in the piece. Windows are created from this
    template by windows.js using the timeline in _data/timeline.json.
    Both desktop themes style this same markup.
{%- endcomment -%}
<template id="window-template">
    <div class="window">
        <div class="title-bar">
            <div class="title-bar-text"></div>
            <div class="title-bar-controls">
                <button aria-label="Close"></button>
            </div>
        </div>
        <div class="window-body"></div>
    </div>
</template>
